version: "3.9"

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - complix_mongo_data:/data/db

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/complix
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_string}
      JWT_EXPIRES_IN: 8h
      MAX_UPLOAD_MB: 10
      UPLOAD_DIR: uploads
      CLIENT_ORIGIN: "*"
    volumes:
      - complix_uploads:/app/uploads

volumes:
  complix_mongo_data:
  complix_uploads:
